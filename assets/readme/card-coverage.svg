<text x="38" y="40" font-size="11" font-weight="700" class="mono gold">WINDOWS 0.3.2 / RELEASE EVIDENCE</text><text x="38" y="83" font-size="30" font-weight="700" class="white">303 feature checks. 47 regressions per architecture.</text><path d="M38 104H962" stroke="#E5D0B1" stroke-opacity=".25"/><text x="38" y="140" font-size="19" font-weight="400" class="muted">x64: 303/303 feature checks + 47/47 regressions under ARM emulation.</text><text x="38" y="171" font-size="19" font-weight="400" class="muted">ARM64: 47/47 regressions; no full feature rerun for this UI update.</text><text x="38" y="202" font-size="19" font-weight="400" class="muted">Local Defender scans: no threats in both extracted app/engine folders.</text><text x="38" y="233" font-size="19" font-weight="400" class="muted">Unsigned preview. Manual Explorer drag and native x64 checks pending.</text></svg>
