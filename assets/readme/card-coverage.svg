<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="title">
<title id="title">303 feature checks. 47 regressions per architecture.. x64: 303/303 feature checks + 47/47 regressions under ARM emulation. ARM64: 47/47 regressions; no full feature rerun for this UI update. Local Defender scans: no threats in both extracted app/engine folders. Unsigned preview. Manual Explorer drag and native x64 checks pending.</title><defs>
