<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif} .mono{font-family:Menlo,Consolas,monospace;letter-spacing:2px} .gold{fill:#E5D0B1}.white{fill:#F4F6F8}.muted{fill:#B5C1D1}</style></defs>
