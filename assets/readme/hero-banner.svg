<text x="42" y="45" font-size="12" font-weight="700" class="mono gold">MAC + WINDOWS / LOCAL FILE CONVERSION</text><text x="38" y="151" font-size="112" font-weight="700" class="white">miracle</text><text x="435" y="118" font-size="57" font-weight="400" class="gold">✦</text><text x="42" y="206" font-size="30" font-weight="500" class="gold">Your files. A different form.</text><text x="42" y="247" font-size="20" font-weight="400" class="muted">Apple Silicon · Windows x64 / ARM64 · Open source</text><rect x="42" y="277" width="635" height="39" rx="8" fill="#E5D0B1"/><text x="58" y="303" font-size="15" font-weight="700" class="mono">MAC 0.3.0 TEST  /  WINDOWS 0.3.2 PREVIEW</text></svg>
