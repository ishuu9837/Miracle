<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="title">
<title id="title">Native apps. Bundled conversion engines.. Mac uses Apple frameworks, FFmpeg, LibreOffice and system libarchive. Windows bundles media, image, PDF, document and archive engines. Windows Pages export and OCR are unavailable; fidelity limits apply. App source: MIT. Third-party engines retain their own licenses.</title><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07080A"/><stop offset=".5" stop-color="#121824"/><stop offset="1" stop-color="#080A0F"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#E5D0B1" stop-opacity=".16"/><stop offset="1" stop-color="#E5D0B1" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.5" fill="#A6BBD2" opacity=".13"/></pattern>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif} .mono{font-family:Menlo,Consolas,monospace;letter-spacing:2px} .gold{fill:#E5D0B1}.white{fill:#F4F6F8}.muted{fill:#B5C1D1}</style></defs>
<rect x="1" y="1" width="998" height="268" rx="22" fill="url(#bg)" stroke="#6E7F96" stroke-opacity=".4"/>
<rect x="2" y="2" width="996" height="266" rx="22" fill="url(#dots)"/>
<ellipse cx="850" cy="80" rx="300" ry="220" fill="url(#glow)"/>
<text x="38" y="40" font-size="11" font-weight="700" class="mono gold">BUILT TO WORK LOCALLY</text><text x="38" y="83" font-size="30" font-weight="700" class="white">Native apps. Bundled conversion engines.</text><path d="M38 104H962" stroke="#E5D0B1" stroke-opacity=".25"/><text x="38" y="140" font-size="19" font-weight="400" class="muted">Mac uses Apple frameworks, FFmpeg, LibreOffice and system libarchive.</text><text x="38" y="171" font-size="19" font-weight="400" class="muted">Windows bundles media, image, PDF, document and archive engines.</text><text x="38" y="202" font-size="19" font-weight="400" class="muted">Windows Pages export and OCR are unavailable; fidelity limits apply.</text><text x="38" y="233" font-size="19" font-weight="400" class="muted">App source: MIT. Third-party engines retain their own licenses.</text></svg>
